[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recalboxgui"
version = "0.10.0"
description = "Aplicación Linux para administrar equipos Recalbox"
requires-python = ">=3.10"
dependencies = ["Paramiko>=3.5,<5", "PySide6>=6.7,<7"]

[project.scripts]
recalboxgui = "gui.application:main"

[tool.setuptools.packages.find]
include = ["gui*"]

[tool.setuptools.package-data]
gui = ["assets/*.png", "assets/*.ogg", "i18n/*/*.json", "themes/*/*.json", "themes/*/*.qss"]
